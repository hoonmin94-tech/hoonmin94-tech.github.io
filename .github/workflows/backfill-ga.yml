name: Backfill GA Tag (one-time)

# 기존에 이미 만들어진 글들에 구글 애널리틱스 추적 코드를 한 번에 넣어주는 일회성 작업.
# 자동으로는 절대 실행되지 않고, Actions 탭에서 "Run workflow" 버튼을 눌러야만 실행됩니다.
# 한 번 실행해서 기존 글에 GA 코드가 다 들어갔으면, 이 워크플로우 파일은 지워도 됩니다.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 기존 글에 GA 코드 추가
        run: python backfill_ga.py

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/
          git diff --cached --quiet && echo "변경 없음" || git commit -m "기존 글에 구글 애널리틱스 추적 코드 일괄 추가"
          git push
